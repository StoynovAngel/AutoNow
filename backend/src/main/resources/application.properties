spring.application.name=autonow

spring.config.import=optional:file:.env[.properties]

spring.docker.compose.enabled=false

server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/autoNow}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:12345}

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.sql.init.mode=never

jwt.secret=${JWT_SECRET:8f92c3b2a9e44c8e9d6f1c4e7b2a91c8a3f5d6e8c9b1a2e4f7d8c9a1b2c3}
jwt.algorithm=${JWT_ALGORITHM:HS256}
jwt.expiration=${JWT_EXPIRATION:3600000}

cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080,http://localhost:8081,http://10.0.2.2:8080,http://10.0.2.2:8081}

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY:}
spring.ai.anthropic.chat.model=claude-haiku-4-5-20251001
spring.ai.anthropic.chat.max-tokens=256

logging.level.org.springframework.web=INFO
logging.level.com.angel.autonow=INFO

springdoc.swagger-ui.enabled=false

pricing.base-fare=2.50
pricing.ambulance-base-fare=60.00
pricing.rate-per-km=1.20

pricing.premium-multiplier=1.60

pricing.night-multiplier=1.20
pricing.night-start-hour=22
pricing.night-end-hour=6

pricing.timezone=Europe/Sofia
pricing.currency=EUR

pricing.logistics-base-fare=5.00
pricing.logistics-rate-per-kg=0.05
